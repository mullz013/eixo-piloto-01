name: EIXO pilot - structural gate tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure-and-handoffs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate DNA and handoff contract
        run: python scripts/validate_pilot.py
      - name: Run deterministic contract tests
        run: python -m unittest discover -s tests -v
      - name: Assert release gate blocks unauthorized publication
        run: |
          if python scripts/validate_pilot.py --release; then
            echo 'ERROR: unauthorized release accepted'
            exit 1
          fi
          echo 'Correct: release blocked'
