name: Prévia do site no GitHub Pages
# Prévia autorizada pelo proprietário em 2026-10-22 (handoffs/approval-log.md, PREVIEW-001).
# Publica só a pasta site/. Não é release: ORCH-RELEASE e live_deploy_authorized continuam bloqueados.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
